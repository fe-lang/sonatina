[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/ir",
    "crates/codegen",
    "crates/parser",
    "crates/filecheck",
    "crates/triple",
    "crates/macros",
    "crates/interpreter",
    "crates/verifier",
    "crates/sp1",
    "crates/cranelift",
]
exclude = ["tests/sp1"]

[workspace.package]
version = "0.1.0"
edition = "2024"
