[package]
name = "sonatina-cranelift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Sonatina Developers"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/fe-lang/sonatina/tree/main/crates/cranelift"
repository = "https://github.com/fe-lang/sonatina"
description = "Host-native and SP1 Cranelift backends for Sonatina"
categories = ["compilers"]
keywords = ["compiler", "cranelift", "native", "sp1"]
# The Cranelift crates come from a fe-lang fork until its RISC-V changes are
# upstreamed, and crates.io rejects Git dependencies.
publish = false

[dependencies]
cranelift-codegen = { git = "https://github.com/fe-lang/wasmtime", rev = "94b3dcc3cc823e12a51513c06918ee0dcd3b2aa1", default-features = false, features = ["std", "unwind", "host-arch"] }
cranelift-entity = "0.136.1"
cranelift-frontend = { git = "https://github.com/fe-lang/wasmtime", rev = "94b3dcc3cc823e12a51513c06918ee0dcd3b2aa1" }
cranelift-jit = { git = "https://github.com/fe-lang/wasmtime", rev = "94b3dcc3cc823e12a51513c06918ee0dcd3b2aa1", optional = true }
cranelift-module = { git = "https://github.com/fe-lang/wasmtime", rev = "94b3dcc3cc823e12a51513c06918ee0dcd3b2aa1" }
cranelift-native = { git = "https://github.com/fe-lang/wasmtime", rev = "94b3dcc3cc823e12a51513c06918ee0dcd3b2aa1" }
cranelift-object = { git = "https://github.com/fe-lang/wasmtime", rev = "94b3dcc3cc823e12a51513c06918ee0dcd3b2aa1" }
rustc-hash = "2.0.0"
sonatina-codegen = { path = "../codegen", version = "0.1.0" }
sonatina-ir = { path = "../ir", version = "0.1.0" }
sonatina-triple = { path = "../triple", version = "0.1.0" }
sonatina-verifier = { path = "../verifier", version = "0.1.0" }

[dev-dependencies]
object = { version = "0.39.1", default-features = false, features = ["read", "std"] }
smallvec = "1.15.1"
sonatina-parser = { path = "../parser" }
tempfile = "3.23"

[features]
jit = ["dep:cranelift-jit"]
sp1 = ["cranelift-codegen/riscv64"]

[[test]]
name = "cranelift_sp1"
required-features = ["sp1"]

[[test]]
name = "cranelift_jit"
required-features = ["jit"]
