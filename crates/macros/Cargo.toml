[package]
name = "sonatina-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Sonatina Developers"]
license = "Apache-2.0"
readme = "../../README.md"
homepage = "https://github.com/fe-lang/sonatina/tree/main/crates/macros"
repository = "https://github.com/fe-lang/sonatina"
description = "Procedural macros for defining sonatina-ir instructions and instruction sets"
categories = ["compilers", "wasm"]
keywords = ["compiler", "evm", "wasm", "smart-contract"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
proc-macro2 = "1.0"
quote = "1.0"
